server:
  port: 8085

spring:
  application:
    name: paypulse-backend
  datasource:
    url: jdbc:h2:mem:paypulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        bytecode:
          provider: none

paypulse:
  seeding:
    employee-count: 10000
