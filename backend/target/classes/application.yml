server:
  port: 8080

spring:
  application:
    name: paypulse-backend
  datasource:
    url: jdbc:h2:mem:paypulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true

paypulse:
  seeder:
    enabled: true
    employee-count: 10000

logging:
  level:
    root: INFO
    com.acme.paypulse: INFO
